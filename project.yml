name: MeetRec
options:
  bundleIdPrefix: com.dmemruk
  # The UI is Russian: system formatters (file sizes, dates) and panels then speak Russian too.
  developmentLanguage: ru
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    # No Apple Developer account: ad-hoc signing, no hardened runtime.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  MeetRec:
    type: application
    platform: macOS
    sources:
      - MeetRec
    info:
      path: MeetRec/Info.plist
      properties:
        CFBundleDisplayName: MeetRec
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # Menu bar only, no Dock icon.
        LSUIElement: true
        NSMicrophoneUsageDescription: MeetRec records your microphone together with the screen.
        NSScreenCaptureUsageDescription: MeetRec records the selected display.
        NSAppleEventsUsageDescription: MeetRec opens recordings in QuickTime Player at a marked moment.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmemruk.MeetRec
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - MeetRecTests
  # Unit tests of the logic that is easy to break (file names, transcripts, rules, health). The app is
  # the test host but starts empty under XCTest (see AppDelegate.isRunningTests).
  MeetRecTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MeetRecTests
    dependencies:
      - target: MeetRec
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmemruk.MeetRecTests
        GENERATE_INFOPLIST_FILE: YES
