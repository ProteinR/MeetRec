name: MeetRec
options:
  bundleIdPrefix: com.dmemruk
  # Russian is the source language (the strings in the code); English comes from
  # MeetRec/Localizable.xcstrings. The app follows the system language (or the per-app language in
  # System Settings), and so do system formatters (file sizes, dates) and panels.
  developmentLanguage: ru
  deploymentTarget:
    macOS: "15.0"
packages:
  # Parakeet speech recognition for transcripts, linked only into MeetRecASR (as in Genius Typer). No
  # traits: TTS, diarization and the NeMo text normalizer are left out (pyannote diarizes).
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: 0.17.7
    traits: []
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.10.0"
    CURRENT_PROJECT_VERSION: "27"
    # No Apple Developer account: ad-hoc signing, no hardened runtime.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  MeetRec:
    type: application
    platform: macOS
    sources:
      - MeetRec
      # The crash watchdog's launchd agent, registered with SMAppService.agent (Watchdog.swift).
      - path: LaunchAgents
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      # "Как я выгляжу" runs in its own process: Contents/MacOS/MeetRecMirror.
      - target: MeetRecMirror
        embed: true
        copy:
          destination: executables
      # Speech recognition for transcripts: Contents/MacOS/MeetRecASR, run by transcribe.py.
      - target: MeetRecASR
        embed: true
        copy:
          destination: executables
    info:
      path: MeetRec/Info.plist
      properties:
        CFBundleDisplayName: MeetRec
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # Menu bar only, no Dock icon.
        LSUIElement: true
        NSMicrophoneUsageDescription: MeetRec records your microphone together with the screen.
        NSCameraUsageDescription: MeetRec shows your camera as a mirror before a meeting. Nothing is recorded.
        NSScreenCaptureUsageDescription: MeetRec records the selected display.
        NSAppleEventsUsageDescription: MeetRec opens recordings in QuickTime Player at a marked moment.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmemruk.MeetRec
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - MeetRecTests
      # Tests (and Run from Xcode) in Russian, the source language, whatever the Mac's language:
      # tests check Russian texts. Edit the scheme to try English.
      language: ru
      region: RU
  # The camera mirror ("Как я выгляжу"), started by MeetRec and ended with its window.
  MeetRecMirror:
    type: tool
    platform: macOS
    sources:
      - MeetRecMirror
    settings:
      base:
        PRODUCT_NAME: MeetRecMirror
        PRODUCT_BUNDLE_IDENTIFIER: com.dmemruk.MeetRec.mirror
  # Parakeet (FluidAudio, Neural Engine) for transcribe.py: only this process links FluidAudio.
  MeetRecASR:
    type: tool
    platform: macOS
    sources:
      - MeetRecASR
    dependencies:
      - package: FluidAudio
    settings:
      base:
        PRODUCT_NAME: MeetRecASR
        PRODUCT_BUNDLE_IDENTIFIER: com.dmemruk.MeetRec.asr
        SKIP_INSTALL: YES
  # Unit tests of the logic that is easy to break (file names, transcripts, rules, health). The app is
  # the test host but starts empty under XCTest (see AppDelegate.isRunningTests).
  MeetRecTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MeetRecTests
    dependencies:
      - target: MeetRec
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmemruk.MeetRecTests
        GENERATE_INFOPLIST_FILE: YES
