name: MeetRec
options:
  bundleIdPrefix: com.dmemruk
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # No Apple Developer account: ad-hoc signing, no hardened runtime.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  MeetRec:
    type: application
    platform: macOS
    sources:
      - MeetRec
    info:
      path: MeetRec/Info.plist
      properties:
        CFBundleDisplayName: MeetRec
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # Menu bar only, no Dock icon.
        LSUIElement: true
        NSMicrophoneUsageDescription: MeetRec records your microphone together with the screen.
        NSScreenCaptureUsageDescription: MeetRec records the selected display.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmemruk.MeetRec
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
